<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Mod Expert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #02040a;
            color: #00d2ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
            overflow: hidden;
            position: relative;
        }

        /* Falling Flower Petals Animation */
        .petals-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 20;
        }

        .petal {
            position: absolute;
            top: -20px;
            width: 12px;
            height: 16px;
            background: linear-gradient(135deg, #ff69b4, #ff1493, #ffb6c1);
            border-radius: 50% 0 50% 50%;
            opacity: 0.75;
            animation: fallAndRotate linear infinite;
        }

        @keyframes fallAndRotate {
            0% {
                transform: translateY(-20px) rotate(0deg) translateX(0);
                opacity: 0;
            }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% {
                transform: translateY(96vh) rotate(720deg) translateX(50px);
                opacity: 0;
            }
        }

        /* 7-Color Lighting Animation for Border and Title Text */
        @keyframes rainbowLighting {
            0% { 
                border-color: #00d2ff; 
                box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
                color: #00d2ff;
                text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
            }
            14.28% { 
                border-color: #27c93f; 
                box-shadow: 0 0 25px rgba(39, 201, 63, 0.4);
                color: #27c93f;
                text-shadow: 0 0 10px #27c93f, 0 0 20px #27c93f;
            }
            28.56% { 
                border-color: #ffbd2e; 
                box-shadow: 0 0 25px rgba(255, 189, 46, 0.4);
                color: #ffbd2e;
                text-shadow: 0 0 10px #ffbd2e, 0 0 20px #ffbd2e;
            }
            42.84% { 
                border-color: #ff5f56; 
                box-shadow: 0 0 25px rgba(255, 95, 86, 0.4);
                color: #ff5f56;
                text-shadow: 0 0 10px #ff5f56, 0 0 20px #ff5f56;
            }
            57.12% { 
                border-color: #ff69b4; 
                box-shadow: 0 0 25px rgba(255, 105, 180, 0.4);
                color: #ff69b4;
                text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4;
            }
            71.40% { 
                border-color: #b19cd9; 
                box-shadow: 0 0 25px rgba(177, 156, 217, 0.4);
                color: #b19cd9;
                text-shadow: 0 0 10px #b19cd9, 0 0 20px #b19cd9;
            }
            85.68% { 
                border-color: #ffffff; 
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
                color: #ffffff;
                text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
            }
            100% { 
                border-color: #00d2ff; 
                box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
                color: #00d2ff;
                text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
            }
        }

        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: 96vh;
            background: rgba(4, 7, 16, 0.95);
            backdrop-filter: blur(12px);
            border: 2px solid #00d2ff;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
            position: relative;
            z-index: 2;
            overflow: hidden;
            animation: rainbowLighting 7s infinite linear;
        }

        /* Top Title Area */
        .top-title-container {
            position: absolute;
            top: 2px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 15;
            pointer-events: none;
        }

        .glowing-title {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: rainbowLighting 7s infinite linear;
            text-transform: uppercase;
        }

        /* Top Preview Area */
        .top-frame {
            position: absolute;
            top: 22px;
            left: 5px;
            right: 5px;
            height: 43vh;
            border: none;
            border-radius: 8px;
            background: #000;
            overflow: hidden;
            z-index: 1;
        }

        .preview-scaler {
            width: 200%;
            height: 200%;
            transform: scale(0.5);
            transform-origin: top left;
            position: absolute;
            top: 0;
            left: 0;
            background: #ffffff;
        }

        #preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Middle Controls */
        .middle-container {
            position: absolute;
            top: calc(22px + 43vh + 8px);
            left: 5px;
            right: 5px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: rgba(4, 7, 16, 0.9);
            padding: 3px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        .side-icon-btn, .lock-btn, .clear-btn, .paste-btn, .mode-toggle-btn, .speed-btn {
            width: 28px;
            height: 28px;
            background: rgba(0, 210, 255, 0.06);
            border: 2px solid #00d2ff;
            border-radius: 7px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00d2ff;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 210, 255, 0.2);
            transition: all 0.2s ease;
            position: relative;
        }

        .clear-btn:hover {
            background: #ff5f56;
            border-color: #ff5f56;
            color: #fff;
            box-shadow: 0 0 10px #ff5f56;
        }

        .paste-btn:hover {
            background: #27c93f;
            border-color: #27c93f;
            color: #fff;
            box-shadow: 0 0 10px #27c93f;
        }

        .mode-toggle-btn:hover {
            background: #ffbd2e;
            border-color: #ffbd2e;
            color: #030712;
            box-shadow: 0 0 10px #ffbd2e;
        }

        .lock-btn.locked {
            background: #ffbd2e;
            color: #030712;
            border-color: #ffbd2e;
        }

        .code-pill-btn {
            background: rgba(0, 210, 255, 0.1);
            border: 2px solid #00d2ff;
            padding: 2px 10px;
            border-radius: 50px;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        /* Speed Popup Menu Styling */
        .speed-popup {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(4, 7, 16, 0.98);
            border: 2px solid #00d2ff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            display: none;
            flex-direction: column;
            z-index: 100;
            width: 75px;
            overflow: hidden;
        }

        .speed-option {
            padding: 6px 4px;
            text-align: center;
            font-size: 10px;
            color: #00d2ff;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            transition: background 0.2s;
        }

        .speed-option:last-child {
            border-bottom: none;
        }

        .speed-option:hover {
            background: #00d2ff;
            color: #030712;
        }

        /* Bottom Editor Window */
        .bottom-editor {
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            height: 43vh;
            z-index: 10;
            background: rgba(6, 10, 22, 0.98);
            border: 2px solid #38bdf8;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            animation: bottomGlow 15s infinite;
        }

        @keyframes bottomGlow {
            0% { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
            20% { border-color: #ffffff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); }
            40% { border-color: #ffbd2e; box-shadow: 0 0 15px rgba(255, 189, 46, 0.3); }
            60% { border-color: #27c93f; box-shadow: 0 0 15px rgba(39, 201, 63, 0.3); }
            80% { border-color: #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
            100% { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        }

        .editor-header {
            height: 20px;
            background: rgba(0, 210, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 5px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            position: relative;
            flex-shrink: 0;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        /* Scroll Progress Line Bar */
        .scroll-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            width: 0%;
            background: #00d2ff;
            box-shadow: 0 0 6px #00d2ff;
            transition: width 0.05s linear;
        }

        /* Code Editor Body Text - Optimized & Lag-Free */
        .editor-body {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.4;
            color: #ffffff;
            overflow-y: auto;
            white-space: pre;
            outline: none;
            text-shadow: 0 0 10px #00ffff, 0 0 20px rgba(0, 255, 255, 0.8);
            -webkit-overflow-scrolling: touch;
            will-change: scroll-position;
        }

        .editor-body::-webkit-scrollbar {
            width: 3px;
        }
        .editor-body::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.4);
        }

        /* URL Input Mode Styling */
        .url-editor-body {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .url-label {
            color: #00d2ff;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0,210,255,0.5);
        }

        .url-input-box {
            background: rgba(0, 210, 255, 0.05);
            border: 2px solid #00d2ff;
            border-radius: 7px;
            padding: 8px 10px;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.2);
            width: 100%;
        }

        .connect-btn {
            background: #00d2ff;
            color: #030712;
            border: none;
            border-radius: 7px;
            padding: 8px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .connect-btn:hover {
            background: #27c93f;
            color: #fff;
            box-shadow: 0 0 12px #27c93f;
        }
    </style>
</head>
<body>

    <!-- Falling Flower Petals Container -->
    <div class="petals-container" id="petalsContainer"></div>

    <div class="phone-frame">
        <!-- Top Title Area -->
        <div class="top-title-container">
            <h2 class="glowing-title">𝐇𝐓𝐌𝐋 𝐋𝐈𝐕𝐄 𝐏𝐑𝐄𝐕𝐈𝐄𝐖</h2>
        </div>

        <!-- Top Preview Window -->
        <div class="top-frame">
            <div class="preview-scaler">
                <iframe id="preview-iframe"></iframe>
            </div>
        </div>

        <!-- Middle Controls -->
        <div class="middle-container">
            <div class="side-icon-btn">&lt;/&gt;</div>
            <div class="clear-btn" id="clearBtn" title="Clear Code" onclick="clearCode()">🗑</div>
            <!-- Mode Switch Button -->
            <div class="mode-toggle-btn" id="modeToggleBtn" title="Switch to URL Mode" onclick="toggleEditorMode()">🔗</div>
            <div class="code-pill-btn" id="modePillText">CODE</div>
            <div class="paste-btn" id="pasteBtn" title="Paste Code" onclick="pasteCode()">📋</div>
            <div class="lock-btn" id="lockBtn" title="Lock/Unlock Editor" onclick="toggleLock()">🔒</div>
            
            <!-- Speed Selector Button & Popup -->
            <div class="speed-btn" id="speedBtn" title="Scroll Speed" onclick="toggleSpeedPopup()">
                ⚡
                <div class="speed-popup" id="speedPopup">
                    <div class="speed-option" onclick="selectSpeed(1, event)">1x</div>
                    <div class="speed-option" onclick="selectSpeed(1.5, event)">1.5x</div>
                    <div class="speed-option" onclick="selectSpeed(2, event)">2x</div>
                    <div class="speed-option" onclick="selectSpeed(2.5, event)">2.5x</div>
                    <div class="speed-option" onclick="selectSpeed(3, event)">3x</div>
                </div>
            </div>
        </div>

        <!-- Bottom Editable Area -->
        <div class="bottom-editor">
            <div class="editor-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
                <!-- Scroll Progress Line Bar -->
                <div class="scroll-progress-bar" id="scrollProgressBar"></div>
            </div>
            
            <!-- Code Editor Mode -->
            <div class="editor-body" id="codeEditor" contenteditable="true" oninput="debounceUpdatePreview()" onscroll="updateScrollProgress()">
&lt;div style="text-align:center; padding-top:20vh; font-family:sans-serif;"&gt;
    &lt;h1 style="color:#007BFF;"&gt;𝗚ᗩᗰ𝗘 ᗰ𝗢ᗪ 𝗘᙭ᑭ𝗘ᖇ𝗧&lt;/h1&gt;
    &lt;p style="color:#555;"&gt;Live Html Preview?&lt;/p&gt;
&lt;/div&gt;</div>

            <!-- URL Input Mode (Hidden by default) -->
            <div class="url-editor-body" id="urlEditorBody" style="display: none;">
                <div class="url-label"></div>
                <input type="text" id="urlInput" class="url-input-box" placeholder="https://example.com">
                <button class="connect-btn" onclick="connectUrl()">START</button>
            </div>
        </div>
    </div>

    <script>
        // Generate falling flower petals dynamically
        function createPetals() {
            const container = document.getElementById('petalsContainer');
            const petalCount = 15;
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
                petal.style.animationDelay = (Math.random() * 5) + 's';
                petal.style.transform = `scale(${Math.random() * 0.6 + 0.7})`;
                container.appendChild(petal);
            }
        }

        let isLocked = false;
        let currentMode = 'code'; // 'code' or 'url'

        // Scroll Progress Line Effect
        function updateScrollProgress() {
            const editor = document.getElementById('codeEditor');
            const progressBar = document.getElementById('scrollProgressBar');
            const scrollTop = editor.scrollTop;
            const scrollHeight = editor.scrollHeight - editor.clientHeight;
            const scrollPercent = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
            progressBar.style.width = scrollPercent + '%';
        }

        function toggleEditorMode() {
            const codeEditor = document.getElementById('codeEditor');
            const urlEditorBody = document.getElementById('urlEditorBody');
            const modeToggleBtn = document.getElementById('modeToggleBtn');
            const modePillText = document.getElementById('modePillText');
            const clearBtn = document.getElementById('clearBtn');
            const pasteBtn = document.getElementById('pasteBtn');

            if (currentMode === 'code') {
                currentMode = 'url';
                codeEditor.style.display = 'none';
                urlEditorBody.style.display = 'flex';
                modeToggleBtn.innerHTML = '&lt;/&gt;';
                modeToggleBtn.title = "Switch to Code Mode";
                modePillText.innerText = "URL";
                clearBtn.style.opacity = '0.3';
                clearBtn.style.pointerEvents = 'none';
                pasteBtn.style.opacity = '0.3';
                pasteBtn.style.pointerEvents = 'none';
                document.getElementById('scrollProgressBar').style.width = '0%';
                stopAutoScroll();
            } else {
                currentMode = 'code';
                codeEditor.style.display = 'block';
                urlEditorBody.style.display = 'none';
                modeToggleBtn.innerHTML = '🔗';
                modeToggleBtn.title = "Switch to URL Mode";
                modePillText.innerText = "CODE";
                clearBtn.style.opacity = '1';
                clearBtn.style.pointerEvents = 'auto';
                pasteBtn.style.opacity = '1';
                pasteBtn.style.pointerEvents = 'auto';
                updatePreview();
                updateScrollProgress();
            }
        }

        function connectUrl() {
            const urlInput = document.getElementById('urlInput').value.trim();
            if (!urlInput) {
                alert('❌❌❌');
                return;
            }
            const iframe = document.getElementById('preview-iframe');
            const frameDoc = iframe.contentDocument || iframe.contentWindow.document;
            frameDoc.open();
            frameDoc.write('');
            frameDoc.close();
            
            iframe.src = urlInput;
        }

        function updatePreview() {
            if (isLocked || currentMode !== 'code') return;
            const code = document.getElementById('codeEditor').innerText;
            const iframe = document.getElementById('preview-iframe');
            iframe.removeAttribute('src'); 
            const frameDoc = iframe.contentDocument || iframe.contentWindow.document;
            frameDoc.open();
            frameDoc.write(code);
            frameDoc.close();
            updateScrollProgress();
        }

        // Debounce update preview for lag-free typing/pasting of large code
        let updateTimer = null;
        function debounceUpdatePreview() {
            if (updateTimer) clearTimeout(updateTimer);
            updateTimer = setTimeout(() => {
                updatePreview();
            }, 100);
        }

        function clearCode() {
            if (isLocked || currentMode !== 'code') return;
            const editor = document.getElementById('codeEditor');
            editor.innerText = '';
            updatePreview();
        }

        async function pasteCode() {
            if (isLocked || currentMode !== 'code') return;
            const editor = document.getElementById('codeEditor');
            
            if (navigator.clipboard && navigator.clipboard.readText) {
                try {
                    const text = await navigator.clipboard.readText();
                    editor.innerText = text;
                    updatePreview();
                    return;
                } catch (err) {
                    console.log('Clipboard API blocked, trying fallback...');
                }
            }

            try {
                const textArea = document.createElement('textarea');
                textArea.style.position = 'fixed';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.focus();
                
                const successful = document.execCommand('paste');
                if (successful && textArea.value) {
                    editor.innerText = textArea.value;
                    updatePreview();
                } else {
                    editor.focus();
                    document.execCommand('paste');
                }
                document.body.removeChild(textArea);
            } catch (e) {
                alert('দয়া করে কোডের ঘরে লং-প্রেস করে সরাসরি পেস্ট করুন।');
                editor.focus();
            }
        }

        function toggleLock() {
            isLocked = !isLocked;
            const editor = document.getElementById('codeEditor');
            const lockBtn = document.getElementById('lockBtn');
            
            if (isLocked) {
                editor.contentEditable = "false";
                lockBtn.classList.add('locked');
                lockBtn.title = "Locked (Click to Unlock)";
            } else {
                editor.contentEditable = "true";
                lockBtn.classList.remove('locked');
                lockBtn.title = "Lock Editor";
            }
        }

        // Speed & Auto Scroll Logic
        let isScrolling = false;
        let scrollDirection = 1;
        let scrollAnimId = null;
        let currentSpeedMultiplier = 1;

        function toggleSpeedPopup() {
            if (currentMode !== 'code') return;
            const popup = document.getElementById('speedPopup');
            popup.style.display = popup.style.display === 'flex' ? 'none' : 'flex';
        }

        function selectSpeed(multiplier, event) {
            event.stopPropagation();
            currentSpeedMultiplier = multiplier;
            document.getElementById('speedPopup').style.display = 'none';
            
            // Start scrolling with selected speed
            if (!isScrolling) {
                toggleAutoScrollState(true);
            }
        }

        function toggleAutoScrollState(forceStart = false) {
            const editor = document.getElementById('codeEditor');
            const maxScroll = editor.scrollHeight - editor.clientHeight;
            if (maxScroll <= 0) return;

            if (!forceStart) {
                isScrolling = !isScrolling;
            } else {
                isScrolling = true;
            }

            const speedBtn = document.getElementById('speedBtn');
            if (isScrolling) {
                speedBtn.style.background = '#00d2ff';
                speedBtn.style.color = '#030712';
                speedBtn.title = `Scrolling (${currentSpeedMultiplier}x)`;
                runScroll();
            } else {
                stopAutoScroll();
            }
        }

        // Clicking the speed button directly toggles scroll if popup is closed
        document.getElementById('speedBtn').addEventListener('click', function(e) {
            if (e.target !== this && e.target.classList.contains('speed-option')) return;
            // If popup was closed and clicked directly, toggle scrolling
            const popup = document.getElementById('speedPopup');
            if (popup.style.display !== 'flex') {
                if (!isScrolling) {
                    toggleAutoScrollState(true);
                } else {
                    stopAutoScroll();
                }
            }
        });

        function runScroll() {
            if (!isScrolling) return;
            const editor = document.getElementById('codeEditor');
            const maxScroll = editor.scrollHeight - editor.clientHeight;

            if (editor.scrollTop >= maxScroll) {
                scrollDirection = -1;
            } else if (editor.scrollTop <= 0) {
                scrollDirection = 1;
            }

            // Base speed multiplied by selected speed option (1x, 1.5x, 2x, etc.)
            let baseSpeed = 1.2;
            editor.scrollTop += scrollDirection * baseSpeed * currentSpeedMultiplier;
            scrollAnimId = requestAnimationFrame(runScroll);
        }

        function stopAutoScroll() {
            isScrolling = false;
            const speedBtn = document.getElementById('speedBtn');
            speedBtn.style.background = 'rgba(0, 210, 255, 0.06)';
            speedBtn.style.color = '#00d2ff';
            speedBtn.title = "Scroll Speed";
            if (scrollAnimId) {
                cancelAnimationFrame(scrollAnimId);
            }
        }

        // Close speed popup when clicking outside
        window.addEventListener('click', function(e) {
            const speedBtn = document.getElementById('speedBtn');
            const popup = document.getElementById('speedPopup');
            if (!speedBtn.contains(e.target)) {
                popup.style.display = 'none';
            }
        });

        window.onload = function() {
            createPetals();
            updatePreview();
            updateScrollProgress();
        };
    </script>
</body>
</html>
